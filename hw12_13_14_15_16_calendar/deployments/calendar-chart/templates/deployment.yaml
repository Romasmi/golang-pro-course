{{- range $name, $image := .Values.images }}
{{- if or (eq $name "calendar") (eq $name "scheduler") (eq $name "sender") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar-chart.fullname" $ }}-{{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      initContainers:
        {{- if or (eq $name "calendar") (eq $name "scheduler") }}
        - name: wait-for-postgres
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z {{ include "calendar-chart.fullname" $ }}-postgres {{ $.Values.config.postgres.port }}; do echo waiting for postgres; sleep 2; done']
        {{- end }}
        {{- if or (eq $name "scheduler") (eq $name "sender") }}
        - name: wait-for-rabbitmq
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z {{ include "calendar-chart.fullname" $ }}-rabbitmq {{ $.Values.config.rabbitmq.port }}; do echo waiting for rabbitmq; sleep 2; done']
        {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          env:
            - name: LOGGER_LEVEL
              value: {{ $.Values.config.logger.level | quote }}
            {{- if or (eq $name "calendar") (eq $name "scheduler") }}
            - name: POSTGRES_HOST
              value: {{ include "calendar-chart.fullname" $ }}-postgres
            - name: POSTGRES_PORT
              value: {{ $.Values.config.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ $.Values.config.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ $.Values.config.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ $.Values.config.postgres.db | quote }}
            {{- end }}
            {{- if or (eq $name "scheduler") (eq $name "sender") }}
            - name: RABBITMQ_HOST
              value: {{ include "calendar-chart.fullname" $ }}-rabbitmq
            - name: RABBITMQ_PORT
              value: {{ $.Values.config.rabbitmq.port | quote }}
            - name: RABBITMQ_DEFAULT_USER
              value: {{ $.Values.config.rabbitmq.user | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              value: {{ $.Values.config.rabbitmq.password | quote }}
            {{- end }}
            {{- if eq $name "calendar" }}
            - name: CALENDAR_HTTP_HOST
              value: "0.0.0.0"
            - name: CALENDAR_HTTP_PORT
              value: {{ $.Values.config.calendar.http.port | quote }}
            - name: CALENDAR_GRPC_HOST
              value: "0.0.0.0"
            - name: CALENDAR_GRPC_PORT
              value: {{ $.Values.config.calendar.grpc.port | quote }}
            {{- end }}
            {{- if eq $name "scheduler" }}
            - name: SCHEDULER_HTTP_HOST
              value: "0.0.0.0"
            - name: SCHEDULER_HTTP_PORT
              value: {{ $.Values.config.scheduler.http.port | quote }}
            - name: SCHEDULER_SCAN_INTERVAL
              value: {{ $.Values.config.scheduler.scanInterval | quote }}
            - name: SCHEDULER_CLEAN_INTERVAL
              value: {{ $.Values.config.scheduler.cleanInterval | quote }}
            {{- end }}
            {{- if eq $name "sender" }}
            - name: SENDER_HTTP_HOST
              value: "0.0.0.0"
            - name: SENDER_HTTP_PORT
              value: {{ $.Values.config.sender.http.port | quote }}
            {{- end }}
          {{- if eq $name "calendar" }}
          ports:
            - name: http
              containerPort: {{ $.Values.config.calendar.http.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ $.Values.config.calendar.grpc.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          {{- end }}
          {{- if or (eq $name "scheduler") (eq $name "sender") }}
          ports:
            - name: health
              containerPort: {{ (index $.Values.config $name).http.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
{{- end }}
{{- end }}
