global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'calendar'
    static_configs:
      - targets: ['calendar:8080']

  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:8081']

  - job_name: 'sender'
    static_configs:
      - targets: ['sender:8081']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
